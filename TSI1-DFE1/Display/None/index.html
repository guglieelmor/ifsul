<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Display None</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h2>display: none</h2>

    <!-- Esse elemento NÃO aparece e nem ocupa espaço -->
    <div class="box escondido">Você não vai ver isso</div>

    <!-- Esse aparece normalmente -->
    <div class="box">Elemento visível</div>
  </body>
</html>
