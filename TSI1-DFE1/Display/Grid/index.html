<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Exemplos de Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h2>1. Grid com 3 colunas</h2>
    <div class="container colunas">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <!-- ============================ -->

    <h2>2. Grid com 4 colunas</h2>
    <div class="container auto">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <!-- ============================ -->

    <h2>3. Item ocupando 2 colunas</h2>
    <div class="container span">
      <div class="box grande">Ocupa 2 colunas</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <!-- ============================ -->

    <h2>4. Item ocupando 2 linhas</h2>
    <div class="container linhas">
      <div class="box alto">Ocupa 2 linhas</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
    </div>

    <!-- ============================ -->

    <h2>5. Layout real com Grid</h2>
    <div class="container layout">
      <div class="box header">Header</div>
      <div class="box menu">Menu</div>
      <div class="box main">Conteúdo</div>
      <div class="box footer">Footer</div>
    </div>
  </body>
</html>
