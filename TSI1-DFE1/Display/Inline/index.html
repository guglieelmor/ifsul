<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Grid Completo</title> 
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h2>1. Grid com colunas fixas</h2>
    <div class="container grid-3">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <!-- ============================== -->

    <h2>2. Grid responsivo (auto-fit)</h2>
    <div class="container grid-auto">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <!-- ============================== -->

    <h2>3. Linhas e colunas</h2>
    <div class="container grid-linhas">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <!-- ============================== -->

    <h2>4. Itens expandindo</h2>
    <div class="container expandir">
      <div class="box box1">1</div>
      <div class="box box2">2</div>
      <div class="box">3</div>
    </div>

    <!-- ============================== -->

    <h2>5. Posicionamento manual</h2>
    <div class="container posicao">
      <div class="box box1">1</div>
      <div class="box box2">2</div>
      <div class="box">3</div>
    </div>

    <!-- ============================== -->

    <h2>6. Layout real (header, sidebar, main, footer)</h2>
    <div class="container layout">
      <div class="box header">Header</div>
      <div class="box sidebar">Sidebar</div>
      <div class="box main">Main</div>
      <div class="box footer">Footer</div>
    </div>

    <!-- ============================== -->

    <h2>7. Alinhamento no Grid</h2>
    <div class="container alinhamento">
      <div class="box">1</div>
      <div class="box">2</div>
    </div>
  </body>
</html>
