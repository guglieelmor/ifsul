<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Position</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h2>1. static (normal)</h2>
    <div class="box static">Static (não muda nada)</div>

    <!-- ========================== -->

    <h2>2. relative</h2>
    <div class="box relative">Relative (move mas mantém espaço)</div>

    <!-- ========================== -->

    <h2>3. absolute</h2>
    <div class="container">
      <div class="box absolute">Absolute (posicionado dentro do container)</div>
    </div>

    <!-- ========================== -->

    <h2>4. fixed</h2>
    <div class="box fixed">Fixed (fica preso na tela)</div>

    <!-- ========================== -->

    <h2>5. sticky (rola a página)</h2>
    <div class="box sticky">Sticky (gruda no topo)</div>

    <p>Role a página pra ver o sticky funcionando...</p>
  </body>
</html>
